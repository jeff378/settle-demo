<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포트폴리오 대표 이미지 (1:1)</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 대표/메인 이미지 — 뷰포트 크기에 맞춰 늘어납니다.
   포트폴리오 대표 : 1200x1200 (1:1)
   서비스 메인     : 1304x976 (4:3, 652x488의 2배)
   헤드리스 Chrome --window-size 로 비율을 정해 캡처합니다. */
*{box-sizing:border-box; margin:0; padding:0}
html,body{width:100%; height:100%}
body{
  overflow:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  background:#fbfaf8; color:#1a1815;
  display:flex; flex-direction:column;
}
.bar{
  background:#a8611a; color:#fff; text-align:center;
  font-size:24px; font-weight:800; padding:16px; letter-spacing:.01em;
}
.body{flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 84px}

.kicker{font-size:26px; font-weight:800; color:#8a5527; letter-spacing:.1em; margin-bottom:14px}
h1{font-size:70px; font-weight:800; letter-spacing:-.035em; line-height:1.15; margin-bottom:12px}
.sub{font-size:29px; color:#6d665b; line-height:1.5; margin-bottom:52px}
.sub b{color:#1a1815; font-weight:700}

.flow{display:flex; align-items:stretch; gap:22px; margin-bottom:46px}
.box{
  flex:1; background:#fff; border:2px solid #e3ded6; border-radius:22px;
  padding:30px 32px; display:flex; flex-direction:column; justify-content:center;
}
.box .l{font-size:25px; color:#6d665b; font-weight:700; margin-bottom:10px}
.box .v{font-size:58px; font-weight:800; letter-spacing:-.04em; font-variant-numeric:tabular-nums; line-height:1}
.box.gap{border-color:#a8611a}
.box.gap .v{color:#a8611a}
.box.zero{border-color:#2f6b45; background:#e9f3ec}
.box.zero .v{color:#2f6b45}
.box .n{font-size:22px; color:#6d665b; margin-top:10px; font-weight:600}
.arrow{display:flex; align-items:center; font-size:46px; color:#8a5527; font-weight:800}

.foot{display:flex; gap:14px; flex-wrap:wrap}
.chip{
  font-size:25px; font-weight:700; padding:13px 24px; border-radius:999px;
  background:#f6efe5; color:#8a5527; border:2px solid #e8d9c4;
}
.chip.g{background:#e9f3ec; color:#2f6b45; border-color:#bcdcc7}

/* 가로가 넓고 세로가 짧은 비율(4:3 등)에서는 여백과 글자를 줄여 넘치지 않게 */
@media (min-aspect-ratio: 5/4){
  .bar{font-size:25px; padding:16px}
  .body{padding:0 72px}
  .kicker{font-size:27px; margin-bottom:12px}
  h1{font-size:72px; margin-bottom:14px}
  .sub{font-size:30px; margin-bottom:42px}
  .flow{gap:22px; margin-bottom:40px}
  .box{padding:28px 32px; border-radius:20px}
  .box .l{font-size:25px; margin-bottom:9px}
  .box .v{font-size:60px}
  .box .n{font-size:22px; margin-top:9px}
  .arrow{font-size:46px}
  .chip{font-size:25px; padding:14px 26px}
}
</style>
</head>
<body>
  <div class="bar">⚠️ 가상 데이터 — 데모용으로 만들어낸 예시입니다</div>
  <div class="body">
    <div class="kicker">정산 차액 분석기</div>
    <h1>차액이 왜 생겼는지<br>원인별로 찾아냅니다</h1>
    <p class="sub">플랫폼 정산 명세서와 내부 매출 기록을 대조해<br><b>두 숫자가 다른 이유</b>를 사람 대신 분류합니다</p>

    <div class="flow">
      <div class="box gap">
        <div class="l">총 차액</div>
        <div class="v">−609,000원</div>
        <div class="n">이유를 모르는 상태</div>
      </div>
      <div class="arrow">→</div>
      <div class="box zero">
        <div class="l">미설명 잔액</div>
        <div class="v">0원</div>
        <div class="n">전액 원인 확정</div>
      </div>
    </div>

    <div class="foot">
      <span class="chip">5단계 매칭</span>
      <span class="chip">원인 7종 자동 분류</span>
      <span class="chip g">데이터 외부 전송 없음</span>
    </div>
  </div>
</body>
</html>
